name: CI - Automatización QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 11 * * 1-5' # Lunes a viernes 06:00 (hora Perú, UTC-5)
  workflow_dispatch:
    inputs:
      ambiente_api:
        description: 'Ambiente de la API (Karate)'
        type: choice
        options: [local, publico]
        default: local
      tags_ui:
        description: 'Tags de Cucumber para la UI (ej: @smoke). Vacío = todos'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karate:
    name: API · Karate (${{ inputs.ambiente_api || 'local' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reto-karate-prima
    env:
      AMBIENTE: ${{ inputs.ambiente_api || 'local' }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: reto-karate-prima/pom.xml

      - name: Instalar Node.js (para ServeRest local)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Levantar ServeRest local
        if: env.AMBIENTE == 'local'
        run: |
          npx -y serverest@latest --nodoc > serverest.log 2>&1 &
          timeout 90 bash -c 'until curl -sf http://localhost:3000/usuarios > /dev/null; do sleep 2; done'

      - name: Ejecutar pruebas de API
        run: mvn -B test "-Dkarate.env=${AMBIENTE}"

      - name: Resumen de resultados
        if: always()
        run: node ../scripts/ci/resumen-karate.js "${AMBIENTE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-karate
          path: |
            reto-karate-prima/target/karate-reports/
            reto-karate-prima/target/karate.log
            reto-karate-prima/serverest.log
          if-no-files-found: warn
          retention-days: 14

  playwright:
    name: UI · Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: reto-playwright-prima
    env:
      BROWSER: ${{ matrix.browser }}
      TAGS: ${{ inputs.tags_ui }}
      HEADLESS: 'true'
      WORKERS: '2'
      RETRIES: '1'

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reto-playwright-prima/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos de TypeScript
        run: npm run typecheck

      - name: Instalar navegador ${{ matrix.browser }}
        run: npx playwright install --with-deps "${BROWSER}"

      - name: Ejecutar pruebas UI
        run: |
          if [ -n "${TAGS}" ]; then
            npx cucumber-js --tags "${TAGS}"
          else
            npm test
          fi

      - name: Resumen de resultados
        if: always()
        run: node ../scripts/ci/resumen-playwright.js "${BROWSER}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright-${{ matrix.browser }}
          path: reto-playwright-prima/reports/
          if-no-files-found: warn
          retention-days: 14
